<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JENNY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Background grid + scanlines -->
  <div class="bg-grid"></div>
  <div class="bg-scanlines"></div>
  <div class="vignette"></div>

  <!-- Top HUD bar -->
  <header class="hud-top">
    <div class="hud-left">
      <span class="brand">J.E.N.N.Y</span>
      <span class="brand-sub">Just&nbsp;Enhanced&nbsp;Neural&nbsp;Network&nbsp;for&nbsp;You</span>
    </div>
    <div class="hud-right">
      <div class="status-chip" id="statusChip">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Offline</span>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙</button>
    </div>
  </header>

  <!-- Main stage -->
  <main class="stage">
    <!-- The Orb -->
    <div class="orb-wrap" id="orbWrap">
      <canvas id="orbCanvas"></canvas>
      <div class="orb-ring ring1"></div>
      <div class="orb-ring ring2"></div>
      <div class="orb-ring ring3"></div>
      <div class="orb-caption" id="orbCaption">Bereit.</div>
    </div>

    <!-- Live transcript / subtitle -->
    <div class="subtitle" id="subtitle"></div>

    <!-- Control dock -->
    <div class="dock">
      <button class="mic-btn" id="micBtn" title="Sprechen">
        <svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <div class="text-input-wrap">
        <input type="text" id="textInput" placeholder="Sag Jenny dein Ziel… z.B. „Verkaufe Webseiten für 500€“" autocomplete="off" />
        <button id="sendBtn" class="send-btn">▸</button>
      </div>
      <button class="icon-btn big" id="goalsBtn" title="Ziele & Aufgaben">⊞</button>
    </div>
  </main>

  <!-- Goals / mission panel -->
  <aside class="panel" id="goalsPanel">
    <div class="panel-head">
      <h2>Missionen</h2>
      <button class="icon-btn" id="closeGoals">✕</button>
    </div>
    <div class="panel-body" id="goalsList">
      <p class="empty-hint">Noch keine Missionen. Gib Jenny ein Ziel und sie erstellt einen Plan.</p>
    </div>
  </aside>

  <!-- Settings panel -->
  <aside class="panel" id="settingsPanel">
    <div class="panel-head">
      <h2>Einstellungen</h2>
      <button class="icon-btn" id="closeSettings">✕</button>
    </div>
    <div class="panel-body">
      <label class="field">
        <span>KI-Modus</span>
        <select id="brainMode">
          <option value="local">Offline (Demo-Gehirn, ohne Internet)</option>
          <option value="claude">Claude API (echtes Denken)</option>
        </select>
      </label>

      <div id="claudeSettings" class="hidden">
        <label class="field">
          <span>Anthropic API-Key</span>
          <input type="password" id="apiKey" placeholder="sk-ant-…" />
          <small>Wird nur lokal in deinem Browser gespeichert.</small>
        </label>
        <label class="field">
          <span>Modell</span>
          <input type="text" id="modelId" value="claude-opus-4-8" />
        </label>
      </div>

      <label class="field">
        <span>Stimme</span>
        <select id="voiceSelect"></select>
      </label>

      <label class="field row">
        <span>Sprachausgabe</span>
        <input type="checkbox" id="ttsToggle" checked />
      </label>

      <label class="field">
        <span>Tonhöhe ({<span id="pitchVal">1.0</span>})</span>
        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1" />
      </label>
      <label class="field">
        <span>Geschwindigkeit (<span id="rateVal">1.0</span>)</span>
        <input type="range" id="rate" min="0.5" max="1.6" step="0.1" value="1" />
      </label>

      <button class="ghost-btn" id="testVoice">Stimme testen</button>
    </div>
  </aside>

  <!-- Tap-to-start overlay (needed for audio/mic permission) -->
  <div class="boot-overlay" id="bootOverlay">
    <div class="boot-orb"></div>
    <h1>JENNY</h1>
    <p>Tippe, um das System zu starten</p>
    <button id="bootBtn">SYSTEM AKTIVIEREN</button>
  </div>

  <!-- Three.js (für Orb). Lädt online vom CDN.
       Für komplett offline: siehe README -> Offline-Setup. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Fallback auf lokal gevendortes Three.js, falls CDN nicht erreichbar
    window.THREE || document.write('<script src="vendor/three.min.js"><\/script>');
  </script>
  <script src="js/orb.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/brain.js"></script>
  <script src="js/jenny.js"></script>
</body>
</html>
